# This file contains the different endpoints your bot can use.

# Server where the models are pulled from.
# https://rasa.com/docs/rasa/model-storage#fetching-models-from-a-server

# models:
#   url: https://llm-demo2.rasademo.com/api/projects/default/models/tags/production
#   enabled: true
#   # User Rasa Enterprise token
#   # If you use the Rasa Enterprise Helm chart you can set a token by using the `rasax.token` parameter
#   # See: https://github.com/RasaHQ/rasa-x-helm/blob/main/charts/rasa-x/values.yaml#L22
#   token: "rasaXToken"
#   waitTimeBetweenPulls: 20

# Server which runs your custom actions.
# https://rasa.com/docs/rasa/custom-actions

action_endpoint:
  url: "http://localhost:5055/webhook"

# comment out this whole section to speed up the bot and disable rephrasing
# all together
# IMPORTANT: this endpoints yaml is ignored by the deployed bot. it ships its
#   own endpoints yaml which is configured in the helm values here:
#   https://github.com/RasaHQ/financial-demo-flows-llms/blob/helm-values/helm/values.yml
# nlg:
#  type: rephrase
#  rephrase_all: True

# Tracker store which is used to store the conversations.
# By default the conversations are stored in memory.
# https://rasa.com/docs/rasa/tracker-stores

#tracker_store:
#    type: redis
#    url: <host of the redis instance, e.g. localhost>
#    port: <port of your redis instance, usually 6379>
#    db: <number of your database within redis, e.g. 0>
#    password: <password used for authentication>
#    use_ssl: <whether or not the communication is encrypted, default false>

#tracker_store:
#    type: mongod
#    url: <url to your mongo instance, e.g. mongodb://localhost:27017>
#    db: <name of the db within your mongo instance, e.g. rasa>
#    username: <username used for authentication>
#    password: <password used for authentication>

# Event broker which all conversation events should be streamed to.
# https://rasa.com/docs/rasa/event-brokers

#event_broker:
#  url: localhost
#  username: username
#  password: password
#  queue: queue
#
nlg:
  type: rephrase
  summarize_history: False
  llm:
    model_group: rephraser_model_group

# Run OTEL collector (via `otel-docker-compose.yml`), and uncomment this section, to send traces to it.
# tracing:
#  type: otlp
#  endpoint: localhost:4317
#  host: localhost
#  service_name: rasa

# Run OTEL collector (via `otel-docker-compose.yml`), and uncomment this section, to send metrics to it.
# metrics:
#  type: otlp
#  endpoint: localhost:4317
#  host: localhost
#  service_name: rasa

model_groups:
    # Access the model used for rephrasing on AWS SageMaker Staging
  - id: rephraser_model_group
    models:
      - provider: sagemaker_chat
        model: ${AWS_SAGEMAKER_REPHRASER}
        aws_region_name: eu-central-1
        aws_session_name: civr-sagemaker-session
        temperature: 0.1
        max_completion_tokens: 64
        max_tokens: 1024
        timeout: 10
  - id: command_generator_model_group
    models:
      - provider: azure
        deployment: gpt-4o-rasa-dev
        timeout: 10
        api_version: 2024-06-01
        api_key: ${AZURE_API_KEY}
        api_base: ${AZURE_API_BASE}
  - id: embedding_model_group
    models:
      - provider: bedrock
        model: eu.cohere.embed-v4:0
        max_tokens: 2048
        timeout: 10
        aws_access_key_id: ${AWS_ACCESS_KEY_ID}
        aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        aws_region_name: eu-central-2
        aws_session_token: ${AWS_SESSION_TOKEN}